; ESP32-S3-Touch-LCD-1.54  (Waveshare)
; MCU: ESP32-S3R8  |  Flash 16MB  |  OPI PSRAM 8MB
; LCD: ST7789 240x240 SPI  |  Touch: CST816 I2C

[platformio]
boards_dir = boards

[env:esp32_s3_touch_lcd_1_54]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/54.03.20/platform-espressif32.zip
board = esp32-s3-touch-lcd-1.54
framework = arduino
monitor_speed = 115200
monitor_filters = esp32_exception_decoder, time
upload_speed = 921600

build_unflags =
  -std=gnu++11
  -std=gnu++17

build_flags =
  -std=gnu++20
  -DCORE_DEBUG_LEVEL=3
  -DLV_CONF_INCLUDE_SIMPLE
  -DLV_LVGL_H_INCLUDE_SIMPLE
  -I include

lib_deps =
  moononournation/GFX Library for Arduino @ 1.6.0
  lvgl/lvgl @ 9.3.0
  lewisxhe/SensorLib @ 0.3.1
  mathertel/OneButton @ 2.6.1
  bitbank2/JPEGDEC
  https://github.com/schreibfaul1/ESP32-audioI2S.git#3.4.0

lib_archive = no
